name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # USER SERVICE
      - name: Build & Push User Service
        run: |
          docker build -t sakshi052001/user-service ./user-service
          docker push sakshi052001/user-service

      # ORDER SERVICE
      - name: Build & Push Order Service
        run: |
          docker build -t sakshi052001/order-service ./order-service
          docker push sakshi052001/order-service

      # RESTAURANT SERVICE
      - name: Build & Push Restaurant Service
        run: |
          docker build -t sakshi052001/restaurant-service ./restaurant-service
          docker push sakshi052001/restaurant-service

      # DELIVERY SERVICE
      - name: Build & Push Delivery Service
        run: |
          docker build -t sakshi052001/delivery-service ./delivery-service
          docker push sakshi052001/delivery-service

      # NOTIFICATION SERVICE
      - name: Build & Push Notification Service
        run: |
          docker build -t sakshi052001/notification-service ./notification-service
          docker push sakshi052001/notification-service

      # API GATEWAY
      - name: Build & Push API Gateway
        run: |
          docker build -t sakshi052001/api-gateway ./api-gateway
          docker push sakshi052001/api-gateway

      # EUREKA SERVER
      - name: Build & Push Eureka Server
        run: |
          docker build -t sakshi052001/eureka-server ./eureka-server
          docker push sakshi052001/eureka-server