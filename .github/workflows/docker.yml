name: Build & Push Docker Images

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

```
strategy:
  matrix:
    service: [user-service, order-service, restaurant-service, delivery-service, notification-service, eureka-server, api-gateway]

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Java
    uses: actions/setup-java@v3
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Build JAR
    run: mvn clean package -DskipTests
    working-directory: ${{ matrix.service }}

  - name: Build Docker Image
    run: docker build -t sakshi052001/${{ matrix.service }} .
    working-directory: ${{ matrix.service }}

  - name: Login to DockerHub
    run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "sakshi052001" --password-stdin

  - name: Push Docker Image
    run: docker push sakshi052001/${{ matrix.service }}
```
