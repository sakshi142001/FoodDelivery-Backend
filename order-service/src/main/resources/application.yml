server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    # url: jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true
    url: jdbc:mysql://mysql-container:3306/order_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: kafka:9092
    # bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false   # IMPORTANT (avoid class mismatch issues)

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server-container:8761/eureka/
      #defaultZone: http://localhost:8761/eureka/