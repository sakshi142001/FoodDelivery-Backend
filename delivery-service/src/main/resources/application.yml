server:
  port: 8084

spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:mysql://mysql-container:3306/delivery_db
    # url: jdbc:mysql://localhost:3306/delivery_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: kafka:9092
    # bootstrap-servers: localhost:9092

    consumer:
      group-id: delivery-group

      # Error handling deserializer
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        # Delegate actual deserializers
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # Trust package
        spring.json.trusted.packages: "*"

        # Your event class path
        spring.json.value.default.type: com.fooddelivery.delivery_service.kafka.event.OrderEvent

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server-container:8761/eureka/
      # defaultZone: http://localhost:8761/eureka/